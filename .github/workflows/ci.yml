name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: worktime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Wait for Postgres
      run: |
        for i in {1..30}; do
          pg_isready -h 127.0.0.1 -p 5432 -U postgres && break || sleep 1
        done

    - name: Run tests
      env:
        ConnectionStrings__WorkTimeDatabase: "Host=127.0.0.1;Port=5432;Database=worktime_test;Username=postgres;Password=postgres;Include Error Detail=true"
      run: dotnet test --no-build --verbosity normal
